
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | RTyping</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
        .auth-container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
            padding: 35px;
            background: #eee;
            color: #222;
            border-radius: 20px;
            box-shadow: 8px 8px 0 #222;
        }
        .auth-container h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 25px;
        }
        .auth-container label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0 8px;
        }
        .auth-container input {
            width: 100%;
            padding: 13px;
            border: 2px solid #aaa;
            border-radius: 10px;
            font-size: 16px;
        }
        .auth-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #08bf68;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #ffe0e0;
            color: #8b0000;
        }
        /* Hide navigation menu on reset password page */
        .navbar .menu-button,
        .navbar .dropdown-menu,
        .navbar .nav-actions {
         display: none !important;
}
    </style>
</head>
<body>
    <header class="navbar reset-navbar">
    <div class="brand">
        <div class="logo">RT</div>
        <span class="brand-name">RTYPING TEST</span>
    </div>
</header>

    <main class="auth-container">
        <h1>RESET PASSWORD</h1>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('reset_password', token=token) }}">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password"
                   name="confirm_password" minlength="8"
                   autocomplete="new-password" required>

            <button class="auth-button" type="submit">
                RESET PASSWORD
            </button>
        </form>
    </main>
</body>
</html>
