
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | RTyping</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
        .auth-container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
            padding: 35px;
            background: #eee;
            color: #222;
            border-radius: 20px;
            box-shadow: 8px 8px 0 #222;
        }
        .auth-container h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 15px;
        }
        .auth-container p {
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .auth-container label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0 8px;
        }
        .auth-container input {
            width: 100%;
            padding: 13px;
            border: 2px solid #aaa;
            border-radius: 10px;
            font-size: 16px;
        }
        .auth-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #08bf68;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .auth-links {
            margin-top: 20px;
            text-align: center;
        }
        .auth-links a {
            color: #1800b5;
            font-weight: bold;
        }
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #ffe0e0;
            color: #8b0000;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <div class="logo">RT</div>
            <span class="brand-name">RTYPING TEST</span>
        </div>
        <a href="{{ url_for('index') }}"
           style="color:white;text-decoration:none;">HOME</a>
    </header>

    <main class="auth-container">
        <h1>FORGOT PASSWORD?</h1>
        <p>Enter the email address associated with your RTyping account.
           If it's registered, we'll send you a reset link.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your registered email"
                   autocomplete="email" required>

            <button class="auth-button" type="submit">
                SEND RESET LINK
            </button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('login') }}">Back to Sign In</a>
        </div>
    </main>
</body>
</html>
